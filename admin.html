<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Admin — Ile Ase Vodun Ogum Ayres</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f0f;--card:#1a1a1a;--ouro:#c9a84c;--ouro-lt:#f0d060;
  --creme:#ffffff;--cinza:#999;--borda:rgba(201,168,76,.25);--r:12px;
  --fd:'Cinzel',serif;--fb:'Inter',sans-serif;
}
html{font-size:16px}
body{font-family:var(--fb);background:var(--bg);color:var(--creme);min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:40px 16px}

/* LOGIN */
#login-screen{width:100%;max-width:360px;text-align:center}
#login-screen h1{font-family:var(--fd);font-size:1.3rem;color:var(--ouro-lt);margin-bottom:6px}
#login-screen p{font-size:12px;color:var(--cinza);margin-bottom:28px}
.login-box{background:var(--card);border:1px solid var(--borda);border-radius:var(--r);padding:28px 24px}
.login-box label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--ouro);font-weight:600;display:block;margin-bottom:6px;text-align:left}
.login-box input{width:100%;background:rgba(0,0,0,.4);border:1px solid var(--borda);border-radius:8px;color:var(--creme);font-size:15px;padding:11px 13px;outline:none;-webkit-appearance:none;margin-bottom:16px}
.login-box input:focus{border-color:var(--ouro)}
.login-error{font-size:12px;color:#f08080;margin-bottom:12px;display:none}
.btn-login{width:100%;padding:12px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;border:none;background:linear-gradient(135deg,var(--ouro),#a07820);color:#0f0f0f;font-family:var(--fb)}
.btn-login:hover{opacity:.88}

/* ADMIN */
#admin-screen{display:none;width:100%;max-width:600px}
.admin-header{text-align:center;margin-bottom:28px}
.admin-header h1{font-family:var(--fd);font-size:1.2rem;color:var(--ouro-lt);margin-bottom:4px}
.admin-header p{font-size:11px;color:var(--cinza)}
.admin-header a{font-size:11px;color:var(--cinza);text-decoration:none;margin-left:12px}
.admin-header a:hover{color:var(--ouro)}

.section-title{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--ouro);font-weight:600;margin:20px 0 10px;display:flex;align-items:center;gap:8px}
.section-title::after{content:'';flex:1;height:1px;background:var(--borda)}

.btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-admin{display:flex;flex-direction:column;align-items:flex-start;gap:4px;background:var(--card);border:1px solid var(--borda);border-radius:var(--r);padding:14px 16px;cursor:pointer;font-family:var(--fb);color:var(--creme);transition:border-color .15s;text-align:left}
.btn-admin:hover{border-color:var(--ouro)}
.btn-admin .icon{font-size:20px}
.btn-admin .label{font-size:13px;font-weight:600;color:var(--creme-lt)}
.btn-admin .desc{font-size:10px;color:var(--cinza)}
.btn-admin.danger{border-color:rgba(180,40,40,.3)}
.btn-admin.danger:hover{border-color:#f08080}

/* RESULTADO */
.resultado{background:var(--card);border:1px solid var(--borda);border-radius:var(--r);padding:16px;margin-top:16px;display:none;white-space:pre-wrap;font-size:12px;line-height:1.7;color:var(--creme);font-family:monospace;max-height:400px;overflow-y:auto}

/* STATUS */
.status-bar{background:var(--card);border:1px solid var(--borda);border-radius:var(--r);padding:12px 16px;margin-bottom:16px;display:none}
.status-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.status-item .num{font-family:var(--fd);font-size:1.4rem;font-weight:600;color:var(--ouro-lt)}
.status-item .rot{font-size:10px;color:var(--cinza);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}

#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#111;border:1px solid var(--ouro);border-radius:99px;color:var(--ouro-lt);padding:9px 20px;font-size:12px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:999;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.erro{border-color:#f08080;color:#f08080}

.logout{font-size:11px;color:var(--cinza);cursor:pointer;text-decoration:underline}
.logout:hover{color:var(--ouro)}

@media(max-width:400px){.btn-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- TELA DE LOGIN -->
<div id="login-screen">
  <h1>✦ Ile Ase Vodun Ogum Ayres ✦</h1>
  <p>Área restrita — administração</p>
  <div class="login-box">
    <label>Senha de acesso</label>
    <input type="password" id="senha" placeholder="••••••••" onkeydown="if(event.key==='Enter')entrar()"/>
    <div class="login-error" id="login-error">Senha incorreta.</div>
    <button class="btn-login" onclick="entrar()">Entrar</button>
  </div>
</div>

<!-- TELA ADMIN -->
<div id="admin-screen">
  <div class="admin-header">
    <h1>🏛️ Painel de Administração</h1>
    <p>Ile Ase Vodun Ogum Ayres &nbsp;·&nbsp;
      <a href="index.html">🖥️ Desktop</a>
      <a href="mobile.html">📱 Celular</a>
      <span class="logout" onclick="sair()">Sair</span>
    </p>
  </div>

  <!-- Status financeiro -->
  <div class="status-bar" id="status-bar">
    <div class="status-grid">
      <div class="status-item"><div class="num" id="s-ent">—</div><div class="rot">↑ Entradas mês</div></div>
      <div class="status-item"><div class="num" id="s-sai">—</div><div class="rot">↓ Saídas mês</div></div>
      <div class="status-item"><div class="num" id="s-sal">—</div><div class="rot">= Saldo total</div></div>
    </div>
  </div>

  <!-- Estoque -->
  <div class="section-title">🕯️ Consumíveis e Estoque</div>
  <div class="btn-grid">
    <button class="btn-admin" onclick="recalcularEstoque()">
      <span class="icon">🔄</span>
      <span class="label">Recalcular níveis</span>
      <span class="desc">Atualiza % e status de todos os itens</span>
    </button>
    <button class="btn-admin" onclick="listaCompras()">
      <span class="icon">🛒</span>
      <span class="label">Lista de compras</span>
      <span class="desc">Itens que precisam ser repostos</span>
    </button>
  </div>

  <!-- Datas -->
  <div class="section-title">📅 Datas e Obrigações</div>
  <div class="btn-grid">
    <button class="btn-admin" onclick="datasMes()">
      <span class="icon">📅</span>
      <span class="label">Datas do mês</span>
      <span class="desc">Aniversários, festas e obrigações</span>
    </button>
    <button class="btn-admin" onclick="obrigacoes()">
      <span class="icon">⚠️</span>
      <span class="label">Obrigações próximas</span>
      <span class="desc">Próximos 90 dias</span>
    </button>
  </div>

  <!-- Financeiro -->
  <div class="section-title">💰 Financeiro</div>
  <div class="btn-grid">
    <button class="btn-admin" onclick="resumoFin()">
      <span class="icon">📊</span>
      <span class="label">Resumo financeiro</span>
      <span class="desc">Saldo, entradas e saídas</span>
    </button>
    <button class="btn-admin" onclick="carregarTudo()">
      <span class="icon">⟳</span>
      <span class="label">Forçar atualização</span>
      <span class="desc">Recarrega todos os dados do app</span>
    </button>
  </div>

  <!-- Resultado -->
  <div class="resultado" id="resultado"></div>
</div>

<div id="toast"></div>

<script>
// ── SENHA ────────────────────────────────────────────────
// Para trocar a senha: altere o valor abaixo
const SENHA = 'ogum2024';
const URL   = 'https://script.google.com/macros/s/AKfycbz8XRp-FTZ-laAfyjHqC_mvDwvKDCFieibGTvp7u7Fyls9OcmCc2aDvlvsVwAW706SlWw/exec';

function entrar() {
  const s = document.getElementById('senha').value;
  if (s === SENHA) {
    sessionStorage.setItem('terreiro_admin', '1');
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('admin-screen').style.display = 'block';
    resumoFin();
  } else {
    document.getElementById('login-error').style.display = 'block';
    document.getElementById('senha').value = '';
    document.getElementById('senha').focus();
  }
}

function sair() {
  sessionStorage.removeItem('terreiro_admin');
  document.getElementById('admin-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'block';
  document.getElementById('senha').value = '';
}

// Mantém sessão se recarregar
window.addEventListener('DOMContentLoaded', () => {
  if (sessionStorage.getItem('terreiro_admin') === '1') {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('admin-screen').style.display = 'block';
    resumoFin();
  }
  document.getElementById('senha').focus();
});

// ── HELPERS ──────────────────────────────────────────────
function toast(msg, ok=true) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'show' + (ok ? '' : ' erro');
  clearTimeout(t._t); t._t = setTimeout(() => t.className = '', 3000);
}

function mostrar(texto) {
  const el = document.getElementById('resultado');
  el.style.display = 'block';
  el.textContent = texto;
}

function fmtBRL(v) {
  return 'R$ ' + Number(v||0).toLocaleString('pt-BR', {minimumFractionDigits:2});
}

// ── AÇÕES ────────────────────────────────────────────────
async function resumoFin() {
  try {
    const r = await fetch(URL + '?acao=financeiro-resumo');
    const j = await r.json();
    if (j.ok) {
      document.getElementById('s-ent').textContent = fmtBRL(j.entradasMes);
      document.getElementById('s-sai').textContent = fmtBRL(j.saidasMes);
      document.getElementById('s-sal').textContent = fmtBRL(j.saldo);
      document.getElementById('status-bar').style.display = 'block';
      // Breakdown por categoria
      if (j.porCategoria && Object.keys(j.porCategoria).length) {
        let txt = '📊 SAÍDAS POR CATEGORIA\n' + '─'.repeat(30) + '\n';
        Object.entries(j.porCategoria)
          .sort((a,b) => b[1]-a[1])
          .forEach(([cat,val]) => txt += `  ${cat}: ${fmtBRL(val)}\n`);
        txt += '\n' + '─'.repeat(30);
        txt += `\n  Total entradas: ${fmtBRL(j.totalEntradas)}`;
        txt += `\n  Total saídas:   ${fmtBRL(j.totalSaidas)}`;
        txt += `\n  Saldo geral:    ${fmtBRL(j.saldo)}`;
        mostrar(txt);
      }
    }
  } catch(e) { toast('Erro ao carregar financeiro.', false); }
}

async function recalcularEstoque() {
  toast('Recalculando...');
  try {
    const r = await fetch(URL + '?acao=consumiveis-listar');
    const j = await r.json();
    if (!j.ok) { toast('Erro.', false); return; }
    const urgente = j.itens.filter(i => String(i.nivel).includes('Urgente'));
    const alerta  = j.itens.filter(i => String(i.nivel).includes('Alerta'));
    const repor   = j.itens.filter(i => String(i.nivel).includes('Repor'));
    const ok      = j.itens.filter(i => String(i.nivel).includes('OK'));
    let txt = '🔄 STATUS DO ESTOQUE\n' + '─'.repeat(30) + '\n';
    txt += `  ✅ OK:             ${ok.length} itens\n`;
    txt += `  ⚠️ Repor:         ${repor.length} itens\n`;
    txt += `  🔴 Alerta:        ${alerta.length} itens\n`;
    txt += `  🚨 Urgente/Zero:  ${urgente.length} itens\n`;
    mostrar(txt);
    toast('✓ Estoque verificado!');
  } catch(e) { toast('Erro.', false); }
}

async function listaCompras() {
  toast('Gerando lista...');
  try {
    const r = await fetch(URL + '?acao=consumiveis-listar');
    const j = await r.json();
    if (!j.ok) { toast('Erro.', false); return; }
    const nok = j.itens.filter(i => !String(i.nivel).includes('OK') && !String(i.nivel).includes('mínimo'));
    if (!nok.length) { mostrar('✅ Nenhum item precisa ser reposto!'); toast('Tudo em dia!'); return; }
    nok.sort((a,b) => {
      const ord = {'🚨 Urgente / Zero':0,'🔴 Alerta':1,'⚠️ Repor':2};
      return (ord[a.nivel]??3) - (ord[b.nivel]??3);
    });
    let txt = '🛒 LISTA DE COMPRAS\n' + '─'.repeat(30) + '\n';
    let cat = '';
    nok.forEach(i => {
      if (i.nivel !== cat) { txt += `\n${i.nivel}:\n`; cat = i.nivel; }
      const falta = Math.max(0, (Number(i.minimo)||0) - (Number(i.atual)||0));
      txt += `  • ${i.nome} — faltam ${falta} ${i.unidade||''}`;
      if (i.fornecedor) txt += ` (${i.fornecedor})`;
      if (i.precoUnit)  txt += ` · R$${Number(i.precoUnit).toFixed(2)}/un`;
      txt += '\n';
    });
    mostrar(txt);
    toast('✓ Lista gerada!');
  } catch(e) { toast('Erro.', false); }
}

async function datasMes() {
  toast('Carregando...');
  try {
    const r = await fetch(URL + '?acao=datas-mes');
    const j = await r.json();
    if (!j.ok) { toast('Erro.', false); return; }
    const hoje = new Date();
    const nomeMes = hoje.toLocaleString('pt-BR', {month:'long', year:'numeric'});
    let txt = `📅 ${nomeMes.toUpperCase()}\n` + '─'.repeat(30) + '\n';
    if (j.obrigacoes?.length) {
      txt += '\n⚠️ OBRIGAÇÕES:\n';
      j.obrigacoes.forEach(o => txt += `  • ${o.data} — ${o.nome}\n`);
    }
    if (j.aniversariantes?.length) {
      txt += '\n🎂 ANIVERSARIANTES:\n';
      j.aniversariantes.forEach(a => txt += `  • ${a.data} — ${a.nome}\n`);
    }
    if (j.festas?.length) {
      txt += '\n🥁 FESTAS:\n';
      j.festas.forEach(f => txt += `  • ${f.data} — ${f.entidade}${f.saudacao?' ('+f.saudacao+')':''}\n`);
    }
    if (!j.obrigacoes?.length && !j.aniversariantes?.length && !j.festas?.length) {
      txt += '\nNenhuma data especial este mês.';
    }
    mostrar(txt);
    toast('✓ Carregado!');
  } catch(e) { toast('Erro.', false); }
}

async function obrigacoes() {
  toast('Verificando...');
  try {
    const r = await fetch(URL + '?acao=filhos-listar');
    const j = await r.json();
    if (!j.ok) { toast('Erro.', false); return; }
    // filhos-listar não retorna nome — só orixá. Busca todos e filtra próximos 90 dias
    const hoje = new Date(), limite = new Date(hoje);
    limite.setDate(limite.getDate() + 90);
    // Precisamos chamar endpoint específico
    const r2 = await fetch(URL + '?acao=datas-mes');
    const j2 = await r2.json();
    let txt = '⚠️ OBRIGAÇÕES — PRÓXIMOS 90 DIAS\n' + '─'.repeat(30) + '\n';
    if (j2.obrigacoes?.length) {
      j2.obrigacoes.forEach(o => txt += `  • ${o.data} — ${o.nome}\n`);
    } else {
      txt += '\nNenhuma obrigação nos próximos 90 dias.';
    }
    mostrar(txt);
    toast('✓ Verificado!');
  } catch(e) { toast('Erro.', false); }
}

async function carregarTudo() {
  toast('Atualizando todos os dados...');
  await Promise.allSettled([resumoFin(), recalcularEstoque()]);
  toast('✓ Dados atualizados!');
}
</script>
</body>
</html>
