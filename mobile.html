<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Ile Ase Vodun Ogum Ayres</title>
<link rel="manifest" href="manifest.json"/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f0f;--card:#1a1a1a;--card2:#222;
  --ouro:#c9a84c;--ouro-lt:#f0d060;--creme:#fff;--cinza:#999;
  --borda:rgba(201,168,76,.22);--r:12px;
  --fd:'Cinzel',serif;--fb:'Inter',sans-serif;
  --bottom:64px;
}
html,body{height:100%;overflow:hidden}
body{font-family:var(--fb);background:var(--bg);color:var(--creme);display:flex;flex-direction:column}

/* TOPO */
.topo{background:linear-gradient(135deg,#1a0e06,#0a0a0a);border-bottom:1px solid var(--borda);padding:12px 16px 8px;text-align:center;flex-shrink:0}
.topo h1{font-family:var(--fd);font-size:.95rem;color:var(--ouro-lt);letter-spacing:.05em}
.topo p{font-size:9px;color:var(--cinza);margin-top:2px;letter-spacing:.12em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:8px}
.topo p a{color:var(--cinza);text-decoration:none;font-size:9px}
.topo p a:hover{color:var(--ouro)}

/* CONTENT */
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--bottom)+16px)}

/* SKELETON */
.skeleton{background:linear-gradient(90deg,rgba(201,168,76,.08) 25%,rgba(201,168,76,.18) 50%,rgba(201,168,76,.08) 75%);background-size:200% 100%;animation:skel 1.4s infinite;border-radius:6px}
@keyframes skel{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skel-num{height:1.3rem;width:60px;margin:0 auto 3px}

/* PÁGINAS */
.page{display:none;padding:14px 14px 0}
.page.active{display:block}

/* INÍCIO */
.resumo-niveis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px}
.nivel-card{border-radius:10px;padding:12px 4px;text-align:center;border:1px solid transparent;cursor:pointer;-webkit-tap-highlight-color:transparent}
.nivel-card:active{opacity:.7}
.nivel-card .num{font-family:var(--fd);font-size:1.3rem;font-weight:600}
.nivel-card .rot{font-size:9px;text-transform:uppercase;letter-spacing:.06em;margin-top:3px;color:var(--cinza)}
.nivel-card.ok{background:rgba(30,107,58,.18);border-color:rgba(30,107,58,.3)}.nivel-card.ok .num{color:#7fd67f}
.nivel-card.repor{background:rgba(180,140,0,.15);border-color:rgba(180,140,0,.3)}.nivel-card.repor .num{color:#e0c040}
.nivel-card.alerta{background:rgba(180,40,40,.18);border-color:rgba(180,40,40,.3)}.nivel-card.alerta .num{color:#f08080}
.nivel-card.urgente{background:rgba(120,0,0,.25);border-color:rgba(200,0,0,.35)}.nivel-card.urgente .num{color:#ff6060}
.ornamento{text-align:center;color:var(--ouro);letter-spacing:.4em;font-size:11px;margin:0 0 14px}
.home-card{background:var(--card);border:1px solid var(--borda);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.home-card-titulo{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--ouro);margin-bottom:8px;font-weight:600}
.home-item{display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.home-item:last-child{border:none}
.home-item .data{color:var(--cinza);font-size:11px}

/* SECAO TITULO */
.secao-titulo{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--ouro);font-weight:600;margin:16px 0 10px;display:flex;align-items:center;gap:8px}
.secao-titulo::after{content:'';flex:1;height:1px;background:var(--borda)}

/* FORMULÁRIO */
.form-box{background:rgba(10,20,10,.3);border:1px solid rgba(150,200,150,.15);border-radius:var(--r);padding:14px;margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.field:last-child{margin-bottom:0}
.field label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ouro)}
.field input,.field select,.field textarea{background:rgba(0,0,0,.35);border:1px solid var(--borda);border-radius:8px;color:var(--creme);font-size:14px;padding:10px 12px;outline:none;font-family:var(--fb);-webkit-appearance:none;width:100%}
.field textarea{resize:none;min-height:60px;line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ouro)}
.field input[type=date]{color-scheme:dark}
.btn-row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.btn{padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;border:none;font-family:var(--fb);-webkit-tap-highlight-color:transparent}
.btn-primary{background:linear-gradient(135deg,var(--ouro),#a07820);color:#0f0f0f}
.btn-ghost{background:transparent;border:1px solid var(--borda);color:var(--cinza)}
.btn:active{opacity:.8}

/* FILTER */
.filter-bar{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}
.filter-bar input,.filter-bar select{background:rgba(0,0,0,.35);border:1px solid var(--borda);border-radius:8px;color:var(--creme);font-size:13px;padding:9px 11px;outline:none;font-family:var(--fb);-webkit-appearance:none;width:100%}
.results-count{font-size:11px;color:var(--cinza);margin-bottom:8px}

/* ACERVO */
.item-card{background:var(--card);border:1px solid var(--borda);border-radius:var(--r);padding:12px;margin-bottom:7px;-webkit-tap-highlight-color:transparent}
.item-card:active{opacity:.8}
.item-nome{font-size:14px;font-weight:600;margin-bottom:3px}
.item-cat{font-size:11px;color:var(--cinza);margin-bottom:6px}
.item-status{font-size:10px;font-weight:600;padding:2px 8px;border-radius:99px;display:inline-block}
.status-Disponível{background:#e6f4ea22;color:#7fd67f;border:1px solid #7fd67f44}
.status-Em\ uso{background:#e8f0fe22;color:#90b0f0;border:1px solid #90b0f044}
.status-Danificado{background:#fef3e222;color:#e0c040;border:1px solid #e0c04044}
.status-Necessita\ reposição{background:#fdecea22;color:#f08080;border:1px solid #f0808044}

/* CONSUMÍVEIS */
.csm-card{background:var(--card);border:1px solid var(--borda);border-radius:var(--r);padding:12px 14px;margin-bottom:7px;-webkit-tap-highlight-color:transparent}
.csm-card:active{opacity:.8}
.csm-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px}
.csm-nome{font-size:13px;font-weight:600;flex:1}
.csm-cat{font-size:10px;color:var(--cinza);margin-top:2px}
.csm-bar-wrap{height:5px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden;margin-bottom:4px}
.csm-bar{height:100%;border-radius:99px}
.csm-info{display:flex;justify-content:space-between;font-size:10px;color:var(--cinza)}
.nivel-badge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:99px;flex-shrink:0}
.nivel-ok{background:#e6f4ea22;color:#7fd67f;border:1px solid #7fd67f44}
.nivel-repor{background:#fef9e722;color:#e0c040;border:1px solid #e0c04044}
.nivel-alerta{background:#fdecea22;color:#f08080;border:1px solid #f0808044}
.nivel-urgente{background:#5c000022;color:#ff6060;border:1px solid #ff606044}

/* FILHOS */
.filho-card{background:var(--card);border:1px solid var(--borda);border-radius:var(--r);padding:14px;margin-bottom:7px;text-align:center}
.filho-titulo{font-size:14px;font-weight:600;color:var(--ouro-lt);margin-bottom:3px}
.filho-nacao{font-size:10px;color:var(--cinza);margin-bottom:8px}
.filho-row{display:flex;justify-content:space-between;font-size:11px;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.04);text-align:left}
.filho-row:last-child{border:none}
.filho-rot{color:var(--cinza)}
.fs-abiao{background:#fff9e622;color:#e0c040;border:1px solid #e0c04044;font-size:10px;font-weight:600;padding:2px 8px;border-radius:99px;display:inline-block;margin-bottom:8px}
.fs-ativo{background:#e6f4ea22;color:#7fd67f;border:1px solid #7fd67f44;font-size:10px;font-weight:600;padding:2px 8px;border-radius:99px;display:inline-block;margin-bottom:8px}
.fs-ebomi{background:#e8f0fe22;color:#90b0f0;border:1px solid #90b0f044;font-size:10px;font-weight:600;padding:2px 8px;border-radius:99px;display:inline-block;margin-bottom:8px}
.fs-iao{background:#f0e6ff22;color:#c090f0;border:1px solid #c090f044;font-size:10px;font-weight:600;padding:2px 8px;border-radius:99px;display:inline-block;margin-bottom:8px}
.fs-inativo{background:#33333322;color:#888;border:1px solid #88888844;font-size:10px;font-weight:600;padding:2px 8px;border-radius:99px;display:inline-block;margin-bottom:8px}
.fs-oga{background:#fdecea22;color:#f0a080;border:1px solid #f0a08044;font-size:10px;font-weight:600;padding:2px 8px;border-radius:99px;display:inline-block;margin-bottom:8px}
.fs-suspenso{background:#fdecea22;color:#f08080;border:1px solid #f0808044;font-size:10px;font-weight:600;padding:2px 8px;border-radius:99px;display:inline-block;margin-bottom:8px}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:flex-end;z-index:100}
.modal-overlay.open{display:flex}
.modal{background:#1a1a1a;border:1px solid var(--borda);border-radius:var(--r) var(--r) 0 0;padding:18px 16px;width:100%;max-height:75dvh;overflow-y:auto}
.modal-titulo{font-family:var(--fd);font-size:.95rem;color:var(--ouro-lt);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.modal-fechar{cursor:pointer;color:var(--cinza);font-size:20px;line-height:1;padding:4px}
.modal-row{display:flex;justify-content:space-between;font-size:12px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.modal-row:last-child{border:none}
.modal-rot{color:var(--cinza)}

/* ML */
.ml-item{background:rgba(0,0,0,.3);border:1px solid var(--borda);border-radius:8px;padding:10px;display:flex;gap:10px;align-items:center;margin-bottom:6px}
.ml-thumb{width:40px;height:40px;object-fit:contain;border-radius:6px;flex-shrink:0;background:#111}
.ml-info{flex:1;min-width:0}
.ml-nome{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ml-preco{font-size:13px;font-weight:700;color:var(--ouro-lt)}
.btn-ml-usar{font-size:11px;padding:6px 10px;border-radius:8px;background:rgba(201,168,76,.15);border:1px solid var(--borda);color:var(--ouro);cursor:pointer;font-family:var(--fb);flex-shrink:0}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:var(--bottom);background:#111;border-top:1px solid var(--borda);display:flex;align-items:stretch;z-index:50;padding-bottom:env(safe-area-inset-bottom)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;border:none;color:var(--cinza);font-family:var(--fb);font-size:9px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:color .15s}
.nav-btn .ic{font-size:19px;line-height:1}
.nav-btn.active{color:var(--ouro-lt)}
.nav-btn.active::after{content:'';display:block;width:20px;height:2px;background:var(--ouro);border-radius:1px;margin-top:2px}

/* PWA BANNER */
#pwa-banner{display:none;position:fixed;top:0;left:0;right:0;background:#1a1a1a;border-bottom:1px solid var(--borda);padding:10px 14px;align-items:center;gap:10px;z-index:200}
#pwa-banner p{flex:1;font-size:12px;color:var(--creme)}
.btn-pwa{padding:6px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:none;font-family:var(--fb)}
.btn-pwa.sim{background:var(--ouro);color:#0f0f0f}
.btn-pwa.nao{background:transparent;border:1px solid var(--borda);color:var(--cinza)}

.empty{text-align:center;color:var(--cinza);font-size:13px;padding:40px 16px;font-style:italic}
#toast{position:fixed;bottom:calc(var(--bottom)+10px);left:50%;transform:translateX(-50%) translateY(20px);background:#111;border:1px solid var(--ouro);border-radius:99px;color:var(--ouro-lt);padding:8px 18px;font-size:12px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:999;white-space:nowrap;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.erro{border-color:#f08080;color:#f08080}
</style>
</head>
<body>

<div id="pwa-banner">
  <p>📱 Instalar na tela inicial?</p>
  <button class="btn-pwa nao" onclick="document.getElementById('pwa-banner').style.display='none'">Não</button>
  <button class="btn-pwa sim" onclick="installPwa()">Instalar</button>
</div>

<div class="topo">
  <h1>✦ Ile Ase Vodun Ogum Ayres ✦</h1>
  <p>Terreiro de Umbanda · <a href="index.html">🖥️ Versão desktop</a></p>
</div>

<div class="content">

  <!-- INÍCIO -->
  <div class="page active" id="page-home">
    <div style="padding-top:14px">
      <div class="resumo-niveis">
        <div class="nivel-card ok" onclick="filtrarNivel('ok')">
          <div class="num skeleton skel-num" id="cnt-ok"></div>
          <div class="rot">✅ OK</div>
        </div>
        <div class="nivel-card repor" onclick="filtrarNivel('repor')">
          <div class="num skeleton skel-num" id="cnt-repor"></div>
          <div class="rot">⚠️ Repor</div>
        </div>
        <div class="nivel-card alerta" onclick="filtrarNivel('alerta')">
          <div class="num skeleton skel-num" id="cnt-alerta"></div>
          <div class="rot">🔴 Alerta</div>
        </div>
        <div class="nivel-card urgente" onclick="filtrarNivel('urgente')">
          <div class="num skeleton skel-num" id="cnt-urgente"></div>
          <div class="rot">🚨 Urgente</div>
        </div>
      </div>
      <div class="ornamento">✦ ✦ ✦</div>
      <div id="home-datas"></div>
    </div>
  </div>

  <!-- CADASTRAR -->
  <div class="page" id="page-cadastro">
    <div class="secao-titulo">📦 Novo item do acervo</div>
    <div class="form-box">
      <div class="field"><label>Nome do item *</label>
        <input type="text" id="c-nome" placeholder="Ex: Ojá de Oxum" autocomplete="off"/>
      </div>
      <div class="field"><label>Categoria *</label>
        <select id="c-cat" onchange="atualizarSubcat()">
          <option value="">Selecione</option>
          <option>Alimentos e oferendas</option>
          <option>Ervas e plantas</option>
          <option>Ferramentas e objetos rituais</option>
          <option>Roupas e indumentárias</option>
        </select>
      </div>
      <div class="field"><label>Subcategoria</label>
        <select id="c-subcat"><option value="">—</option></select>
      </div>
      <div class="field"><label>Orixá / Entidade</label>
        <select id="c-orixa">
          <option value="">—</option>
          <option>Boiadeiro</option><option>Caboclo</option><option>Criança / Erê</option>
          <option>Exu</option><option>Geral / Sem entidade</option><option>Iansã</option>
          <option>Iemanjá</option><option>Marinheiro</option><option>Nanã</option>
          <option>Obá</option><option>Obaluaê / Omolu</option><option>Ogum</option>
          <option>Oxalá</option><option>Oxossi</option><option>Oxum</option>
          <option>Oxumaré</option><option>Pomba-Gira</option><option>Preto-Velho</option>
          <option>Xangô</option><option>Zé Pilintra</option>
        </select>
      </div>
      <div class="field"><label>Status</label>
        <select id="c-status">
          <option value="Disponível">Disponível</option>
          <option value="Danificado">Danificado</option>
          <option value="Em uso">Em uso</option>
          <option value="Necessita reposição">Necessita reposição</option>
        </select>
      </div>
      <div class="field"><label>Localização / Armário</label>
        <input type="text" id="c-local" placeholder="Ex: Armário 2" autocomplete="off"/>
      </div>
      <div class="field"><label>Quantidade</label>
        <input type="number" id="c-qtd" min="1" value="1"/>
      </div>
      <div class="field"><label>Foto (URL)</label>
        <input type="url" id="c-foto" placeholder="https://..."/>
      </div>
      <div class="field"><label>Observações</label>
        <textarea id="c-obs" placeholder="Notas livres..."></textarea>
      </div>
      <div class="btn-row">
        <button class="btn btn-ghost" onclick="limparAcervo()">Limpar</button>
        <button class="btn btn-primary" id="btnAcervo" onclick="salvarAcervo()">Gravar</button>
      </div>
    </div>

    <div class="secao-titulo">🕯️ Atualizar consumível</div>
    <div class="form-box">
      <div class="field"><label>Item (nome exato)</label>
        <input type="text" id="cu-nome" placeholder="Ex: Vela 7 dias branca" autocomplete="off"/>
      </div>
      <div class="field"><label>Quantidade atual</label>
        <input type="number" id="cu-atual" min="0" placeholder="0"/>
      </div>
      <div class="field"><label>Quantidade mínima</label>
        <input type="number" id="cu-min" min="0" placeholder="0"/>
      </div>
      <div class="field"><label>Fornecedor</label>
        <input type="text" id="cu-forn" placeholder="Ex: Casa dos Orixás" autocomplete="off"/>
      </div>
      <div class="field"><label>Preço do pacote (R$)</label>
        <input type="number" id="cu-preco" step="0.01" min="0" placeholder="0,00"/>
      </div>
      <div class="field"><label>Qtd por pacote</label>
        <input type="number" id="cu-qtdpac" min="1" placeholder="1"/>
      </div>
      <div class="field"><label>Link de compra</label>
        <input type="url" id="cu-link" placeholder="https://..."/>
      </div>
      <div class="btn-row">
        <button class="btn btn-ghost" onclick="limparConsumivel()">Limpar</button>
        <button class="btn btn-primary" id="btnCsm" onclick="salvarConsumivel()">Atualizar</button>
      </div>
    </div>

    <div class="secao-titulo">🔍 Buscar no Mercado Livre</div>
    <div class="form-box">
      <div class="field">
        <input type="text" id="ml-q" placeholder="Ex: vela 7 dias branca"/>
      </div>
      <button class="btn btn-primary" onclick="buscarML()" style="width:100%">Buscar</button>
      <div id="ml-resultado" style="margin-top:10px"></div>
    </div>

    <div class="secao-titulo">👥 Novo filho de santo</div>
    <div class="form-box">
      <div class="field"><label>Nome de candomblé / santo</label>
        <input type="text" id="f-nome" autocomplete="off"/>
      </div>
      <div class="field"><label>Nome social</label>
        <input type="text" id="f-social" autocomplete="off"/>
      </div>
      <div class="field"><label>Contato (WhatsApp)</label>
        <input type="tel" id="f-contato" placeholder="(11) 99999-9999"/>
      </div>
      <div class="field"><label>Orixá de cabeça</label>
        <select id="f-orixa">
          <option value="">—</option>
          <option>Exu</option><option>Iansã</option><option>Iemanjá</option>
          <option>Nanã</option><option>Obá</option><option>Obaluaê / Omolu</option>
          <option>Ogum</option><option>Oxalá</option><option>Oxossi</option>
          <option>Oxum</option><option>Oxumaré</option><option>Preto-Velho</option>
          <option>Xangô</option><option>Outro</option>
        </select>
      </div>
      <div class="field"><label>Adjuntó</label>
        <select id="f-adjunto">
          <option value="">—</option>
          <option>Exu</option><option>Iansã</option><option>Iemanjá</option>
          <option>Nanã</option><option>Obá</option><option>Obaluaê / Omolu</option>
          <option>Ogum</option><option>Oxalá</option><option>Oxossi</option>
          <option>Oxum</option><option>Oxumaré</option><option>Preto-Velho</option>
          <option>Xangô</option><option>Outro</option>
        </select>
      </div>
      <div class="field"><label>Nação</label>
        <select id="f-nacao">
          <option value="">—</option>
          <option>Angola</option><option>Efon</option><option>Ijexá</option>
          <option>Jeje</option><option>Ketu</option><option>Nagô</option>
          <option>Omolokô</option><option>Outra</option><option>Umbanda</option>
        </select>
      </div>
      <div class="field"><label>Status</label>
        <select id="f-status">
          <option value="Abiã">Abiã</option>
          <option value="Ativo" selected>Ativo</option>
          <option value="Ebomi">Ebomi</option>
          <option value="Iaô">Iaô</option>
          <option value="Inativo">Inativo</option>
          <option value="Ogã / Ekedi">Ogã / Ekedi</option>
          <option value="Suspenso">Suspenso</option>
        </select>
      </div>
      <div class="field"><label>Data de aniversário</label><input type="date" id="f-aniv"/></div>
      <div class="field"><label>Data de feitura</label><input type="date" id="f-feitura"/></div>
      <div class="field"><label>Próxima obrigação</label><input type="date" id="f-obrig"/></div>
      <div class="field"><label>Obrigações realizadas</label>
        <input type="text" id="f-obrigrealiz" placeholder="Ex: Feitura 2020, 1 ano 2021" autocomplete="off"/>
      </div>
      <div class="field"><label>Observações</label>
        <textarea id="f-obs" placeholder="Notas livres..."></textarea>
      </div>
      <div class="btn-row">
        <button class="btn btn-ghost" onclick="limparFilho()">Limpar</button>
        <button class="btn btn-primary" id="btnFilho" onclick="salvarFilho()">Gravar</button>
      </div>
    </div>
  </div>

  <!-- CONSUMÍVEIS -->
  <div class="page" id="page-consumiveis">
    <div style="padding-top:14px">
      <div class="filter-bar">
        <input type="search" id="cf-busca" placeholder="🔍 Buscar consumível..." oninput="renderConsumiveis()"/>
        <select id="cf-cat" onchange="renderConsumiveis()">
          <option value="">Todas as categorias</option>
          <option>Alimentos</option><option>Bebidas</option>
          <option>Ervas e Defumação</option><option>Flores e Naturais</option>
          <option>Fumo</option><option>Velas</option>
        </select>
        <select id="cf-nivel" onchange="renderConsumiveis()">
          <option value="">Todos os níveis</option>
          <option value="urgente">🚨 Urgente</option>
          <option value="alerta">🔴 Alerta</option>
          <option value="repor">⚠️ Repor</option>
          <option value="ok">✅ OK</option>
        </select>
      </div>
      <div class="results-count" id="cf-count"></div>
      <div id="csm-lista"><div class="empty">Carregando...</div></div>
    </div>
  </div>

  <!-- FILHOS -->
  <div class="page" id="page-filhos">
    <div style="padding-top:14px">
      <div class="filter-bar">
        <input type="search" id="fs-busca" placeholder="🔍 Buscar..." oninput="renderFilhos()"/>
        <select id="fs-orixa" onchange="renderFilhos()">
          <option value="">Todos os orixás</option>
          <option>Exu</option><option>Iansã</option><option>Iemanjá</option>
          <option>Nanã</option><option>Obá</option><option>Obaluaê / Omolu</option>
          <option>Ogum</option><option>Oxalá</option><option>Oxossi</option>
          <option>Oxum</option><option>Oxumaré</option><option>Preto-Velho</option>
          <option>Xangô</option><option>Outro</option>
        </select>
        <select id="fs-status" onchange="renderFilhos()">
          <option value="">Todos os status</option>
          <option>Abiã</option><option>Ativo</option><option>Ebomi</option>
          <option>Iaô</option><option>Inativo</option><option>Ogã / Ekedi</option><option>Suspenso</option>
        </select>
      </div>
      <div class="results-count" id="fs-count"></div>
      <div id="filho-lista"><div class="empty">Carregando...</div></div>
    </div>
  </div>

  <!-- ACERVO -->
  <div class="page" id="page-acervo">
    <div style="padding-top:14px">
      <div class="filter-bar">
        <input type="search" id="a-busca" placeholder="🔍 Buscar item..." oninput="renderAcervo()"/>
        <select id="a-cat" onchange="renderAcervo()">
          <option value="">Todas as categorias</option>
          <option>Alimentos e oferendas</option><option>Ervas e plantas</option>
          <option>Ferramentas e objetos rituais</option><option>Roupas e indumentárias</option>
        </select>
        <select id="a-status" onchange="renderAcervo()">
          <option value="">Todos os status</option>
          <option>Danificado</option><option>Disponível</option>
          <option>Em uso</option><option>Necessita reposição</option>
        </select>
      </div>
      <div class="results-count" id="a-count"></div>
      <div id="acervo-lista"><div class="empty">Carregando...</div></div>
    </div>
  </div>

</div><!-- /content -->

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <button class="nav-btn active" onclick="navTo('home',this)"><span class="ic">🏠</span>Início</button>
  <button class="nav-btn" onclick="navTo('cadastro',this)"><span class="ic">＋</span>Cadastrar</button>
  <button class="nav-btn" onclick="navTo('consumiveis',this)"><span class="ic">🕯️</span>Consumíveis</button>
  <button class="nav-btn" onclick="navTo('filhos',this)"><span class="ic">👥</span>Filhos</button>
  <button class="nav-btn" onclick="navTo('acervo',this)"><span class="ic">📦</span>Acervo</button>
</nav>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay" onclick="fecharModal(event)">
  <div class="modal">
    <div class="modal-titulo">
      <span id="modal-nome">—</span>
      <span class="modal-fechar" onclick="fecharModal()">✕</span>
    </div>
    <div id="modal-corpo"></div>
  </div>
</div>

<div id="toast"></div>

<script>
const URL_GS = 'https://script.google.com/macros/s/AKfycbz8XRp-FTZ-laAfyjHqC_mvDwvKDCFieibGTvp7u7Fyls9OcmCc2aDvlvsVwAW706SlWw/exec';

const SUBCATS = {
  'Alimentos e oferendas':['Alimentos rituais','Axé / Ebó','Bebida ritual','Comida de orixá','Flores','Incenso / Defumação','Vela / Bujão'],
  'Ervas e plantas':['Folha para banho','Folha para defumação','Raiz','Semente'],
  'Ferramentas e objetos rituais':['Arco e flecha','Atabaques / Instrumento','Espada / Ogó','Ferramenta de orixá','Ibá / Sopera','Leque','Pemba / Efun','Xaxará'],
  'Roupas e indumentárias':['Calçado','Capa / Manto','Capacete / Coroa','Guia / Colar','Ojá / Torço','Pulseira / Oxé','Saia','Vestido']
};
const CAT_IC = {Velas:'🕯️',Bebidas:'🍶',Fumo:'🚬','Ervas e Defumação':'🌿',Alimentos:'🌽','Flores e Naturais':'🌸'};
const NIVEL_SLUG = {'✅ OK':'ok','⚠️ Repor':'repor','🔴 Alerta':'alerta','🚨 Urgente / Zero':'urgente'};
const STATUS_CLASS = {Abiã:'fs-abiao',Ativo:'fs-ativo',Ebomi:'fs-ebomi',Iaô:'fs-iao',Inativo:'fs-inativo','Ogã / Ekedi':'fs-oga',Suspenso:'fs-suspenso'};

let acervo=[], consumiveis=[], filhos=[];
let deferredPrompt=null;

window.addEventListener('DOMContentLoaded',()=>{
  Promise.all([carregarHome(),carregarConsumiveis(),carregarAcervo(),carregarFilhos()]).catch(()=>{});
  if('serviceWorker'in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;document.getElementById('pwa-banner').style.display='flex';});
function installPwa(){if(!deferredPrompt)return;deferredPrompt.prompt();deferredPrompt.userChoice.then(()=>{deferredPrompt=null;document.getElementById('pwa-banner').style.display='none';});}

// ── HELPERS ───────────────────────────────────────────
function toast(msg,ok=true){const t=document.getElementById('toast');t.textContent=msg;t.className='show'+(ok?'':' erro');clearTimeout(t._t);t._t=setTimeout(()=>t.className='',3200);}
function fmtData(s){if(!s||s==='—')return'—';try{if(s.includes('/'))return s;return new Date(s).toLocaleDateString('pt-BR');}catch(e){return s;}}
function _fillNum(id,val){const el=document.getElementById(id);if(!el)return;el.classList.remove('skeleton','skel-num');el.textContent=val;}

function navTo(id,el){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  el.classList.add('active');
  document.querySelector('.content').scrollTo(0,0);
}
function filtrarNivel(nivel){
  document.getElementById('cf-nivel').value=nivel;
  renderConsumiveis();
  navTo('consumiveis',document.querySelectorAll('.nav-btn')[2]);
}
function atualizarSubcat(){
  const cat=document.getElementById('c-cat').value;
  const sel=document.getElementById('c-subcat');
  sel.innerHTML='<option value="">—</option>';
  (SUBCATS[cat]||[]).forEach(s=>{const o=document.createElement('option');o.textContent=s;sel.appendChild(o);});
}

// ── HOME ──────────────────────────────────────────────
async function carregarHome(){
  try{
    const r=await fetch(URL_GS+'?acao=datas-mes');
    const j=await r.json();if(!j.ok)return;
    const el=document.getElementById('home-datas');
    let html='';
    if(j.aniversariantes?.length){
      html+=`<div class="home-card"><div class="home-card-titulo">🎂 Aniversariantes do mês</div>`;
      j.aniversariantes.forEach(a=>{html+=`<div class="home-item"><span>${a.nome||'✦ Filho de '+a.orixa}</span><span class="data">${a.data}</span></div>`;});
      html+='</div>';
    }
    if(j.obrigacoes?.length){
      html+=`<div class="home-card"><div class="home-card-titulo">⚠️ Obrigações este mês</div>`;
      j.obrigacoes.forEach(o=>{html+=`<div class="home-item"><span>${o.nome||'Filho de Santo'}</span><span class="data">${o.data}</span></div>`;});
      html+='</div>';
    }
    if(j.festas?.length){
      html+=`<div class="home-card"><div class="home-card-titulo">🥁 Festas de orixás</div>`;
      j.festas.forEach(f=>{html+=`<div class="home-item"><span>${f.entidade}${f.saudacao?' — '+f.saudacao:''}</span><span class="data">${f.data}</span></div>`;});
      html+='</div>';
    }
    if(!html)html='<div class="home-card"><div style="color:var(--cinza);font-size:12px;font-style:italic">Nenhum evento este mês.</div></div>';
    el.innerHTML=html;
  }catch(e){}
}

// ── ACERVO ────────────────────────────────────────────
async function carregarAcervo(){
  try{const r=await fetch(URL_GS+'?acao=listar');const j=await r.json();if(j.ok){acervo=(j.itens||[]).sort((a,b)=>(a.nome||"").localeCompare((b.nome||""),"pt-BR"));renderAcervo();}}
  catch(e){document.getElementById('acervo-lista').innerHTML='<div class="empty">Erro ao carregar.</div>';}
}
function renderAcervo(){
  const busca=(document.getElementById('a-busca').value||'').toLowerCase();
  const cat=document.getElementById('a-cat').value;
  const status=document.getElementById('a-status').value;
  const f=acervo.filter(i=>(!busca||i.nome?.toLowerCase().includes(busca))&&(!cat||i.categoria===cat)&&(!status||i.status===status));
  document.getElementById('a-count').textContent=f.length+' item(s)';
  if(!f.length){document.getElementById('acervo-lista').innerHTML='<div class="empty">Nenhum item encontrado.</div>';return;}
  document.getElementById('acervo-lista').innerHTML=f.map((i,idx)=>`
    <div class="item-card" onclick="abrirModal(${acervo.indexOf(i)})">
      <div class="item-nome">${i.nome||'—'}</div>
      <div class="item-cat">${i.categoria||''}${i.subcategoria?' › '+i.subcategoria:''}</div>
      ${i.status?`<span class="item-status status-${i.status.replace(/ /g,'\\ ')}">${i.status}</span>`:''}
    </div>`).join('');
}
function abrirModal(idx){
  const i=acervo[idx];
  document.getElementById('modal-nome').textContent=i.nome||'—';
  document.getElementById('modal-corpo').innerHTML=[
    ['Categoria',i.categoria+(i.subcategoria?' › '+i.subcategoria:'')],
    ['Orixá / Entidade',i.orixa||'—'],['Status',i.status||'—'],
    ['Localização',i.local||'—'],['Quantidade',i.quantidade||'—'],
    ['Observações',i.observacoes||'—'],['Cadastrado em',fmtData(i.dataCadastro)],
  ].map(([r,v])=>`<div class="modal-row"><span class="modal-rot">${r}</span><span>${v}</span></div>`).join('')+
  (i.foto?`<img src="${i.foto}" style="width:100%;border-radius:8px;margin-top:10px" onerror="this.style.display='none'"/>`:'');
  document.getElementById('modal-overlay').classList.add('open');
}
function fecharModal(e){if(!e||e.target.id==='modal-overlay'||e.currentTarget?.className==='modal-fechar')document.getElementById('modal-overlay').classList.remove('open');}

// ── CONSUMÍVEIS ───────────────────────────────────────
async function carregarConsumiveis(){
  try{
    const r=await fetch(URL_GS+'?acao=consumiveis-listar');const j=await r.json();
    if(j.ok){
      consumiveis=j.itens||[];renderConsumiveis();
      const counts={ok:0,repor:0,alerta:0,urgente:0};
      consumiveis.forEach(i=>{const s=NIVEL_SLUG[i.nivel]||'ok';if(counts[s]!==undefined)counts[s]++;});
      _fillNum('cnt-ok',counts.ok);_fillNum('cnt-repor',counts.repor);
      _fillNum('cnt-alerta',counts.alerta);_fillNum('cnt-urgente',counts.urgente);
    }
  }catch(e){document.getElementById('csm-lista').innerHTML='<div class="empty">Erro ao carregar.</div>';}
}
function renderConsumiveis(){
  const busca=(document.getElementById('cf-busca').value||'').toLowerCase();
  const cat=document.getElementById('cf-cat').value;
  const nivel=document.getElementById('cf-nivel').value;
  const f=consumiveis.filter(i=>(!busca||i.nome?.toLowerCase().includes(busca))&&(!cat||i.categoria===cat)&&(!nivel||(NIVEL_SLUG[i.nivel]||'ok')===nivel));
  document.getElementById('cf-count').textContent=f.length+' item(s)';
  if(!f.length){document.getElementById('csm-lista').innerHTML='<div class="empty">Nenhum item encontrado.</div>';return;}
  document.getElementById('csm-lista').innerHTML=f.map(i=>{
    const a=Number(i.atual)||0,m=Number(i.minimo)||0;
    const pct=m>0?Math.min(100,Math.round(a/m*100)):100;
    const sl=NIVEL_SLUG[i.nivel]||'ok';
    const cor=sl==='ok'?'#7fd67f':sl==='repor'?'#e0c040':sl==='alerta'?'#f08080':'#ff6060';
    return `<div class="csm-card" onclick="abrirModalCsm('${i.id}')">
      <div class="csm-top">
        <div><div class="csm-nome">${CAT_IC[i.categoria]||'📦'} ${i.nome}</div><div class="csm-cat">${i.categoria}</div></div>
        <span class="nivel-badge nivel-${sl}">${i.nivel||'—'}</span>
      </div>
      <div class="csm-bar-wrap"><div class="csm-bar" style="width:${pct}%;background:${cor}"></div></div>
      <div class="csm-info"><span>${a} / ${m} ${i.unidade||''}</span><span>${pct}%</span></div>
    </div>`;
  }).join('');
}
function abrirModalCsm(id){
  const i=consumiveis.find(x=>x.id===id);if(!i)return;
  document.getElementById('modal-nome').textContent=i.nome||'—';
  document.getElementById('modal-corpo').innerHTML=[
    ['Categoria',i.categoria||'—'],['Nível',i.nivel||'—'],
    ['Estoque',`${i.atual||0} / ${i.minimo||0} ${i.unidade||''}`],
    ['Fornecedor',i.fornecedor||'—'],
    ['Preço unitário',i.precoUnit?'R$\u00a0'+Number(i.precoUnit).toLocaleString('pt-BR',{minimumFractionDigits:2}):'—'],
    ['Qtd por pacote',i.qtdPacote||'—'],
    ['Atualizado em',fmtData(i.atualizado)],
  ].map(([r,v])=>`<div class="modal-row"><span class="modal-rot">${r}</span><span>${v}</span></div>`).join('')+
  (i.link?`<div style="margin-top:10px;text-align:center"><a href="${i.link}" target="_blank" style="color:var(--ouro);font-size:12px">🔗 Ver link de compra</a></div>`:'');
  document.getElementById('modal-overlay').classList.add('open');
}

// ── FILHOS ────────────────────────────────────────────
async function carregarFilhos(){
  try{const r=await fetch(URL_GS+'?acao=filhos-listar');const j=await r.json();if(j.ok){filhos=(j.itens||[]).sort((a,b)=>(a.orixa||"").localeCompare((b.orixa||""),"pt-BR"));renderFilhos();}}
  catch(e){document.getElementById('filho-lista').innerHTML='<div class="empty">Erro ao carregar.</div>';}
}
function renderFilhos(){
  const busca=(document.getElementById('fs-busca').value||'').toLowerCase();
  const orixa=document.getElementById('fs-orixa').value;
  const status=document.getElementById('fs-status').value;
  const f=filhos.filter(i=>(!busca||('filho de '+(i.orixa||'')).toLowerCase().includes(busca))&&(!orixa||i.orixa===orixa)&&(!status||i.statusTerreiro===status));
  document.getElementById('fs-count').textContent=f.length+' filho(s)';
  if(!f.length){document.getElementById('filho-lista').innerHTML='<div class="empty">Nenhum registro encontrado.</div>';return;}
  document.getElementById('filho-lista').innerHTML=f.map(i=>{
    const sc=STATUS_CLASS[i.statusTerreiro]||'fs-ativo';
    return `<div class="filho-card">
      <div class="filho-titulo">✦ Filho de ${i.orixa||'—'} ✦</div>
      <div class="filho-nacao">${i.nacao||''}</div>
      ${i.statusTerreiro?`<span class="${sc}">${i.statusTerreiro}</span>`:''}
      ${i.feitura&&i.feitura!=='—'?`<div class="filho-row" style="margin-top:8px"><span class="filho-rot">Feitura</span><span>${i.feitura}</span></div>`:''}
      ${i.proximaObrigacao&&i.proximaObrigacao!=='—'?`<div class="filho-row"><span class="filho-rot">Próxima obrigação</span><span>${i.proximaObrigacao}</span></div>`:''}
    </div>`;
  }).join('');
}

// ── SALVAR ────────────────────────────────────────────
async function salvarAcervo(){
  const nome=document.getElementById('c-nome').value.trim(),cat=document.getElementById('c-cat').value;
  if(!nome||!cat){toast('Preencha nome e categoria.',false);return;}
  const btn=document.getElementById('btnAcervo');btn.disabled=true;btn.textContent='Gravando...';
  try{
    const r=await fetch(URL_GS,{method:'POST',body:JSON.stringify({acao:'inserir',nome,categoria:cat,subcategoria:document.getElementById('c-subcat').value,orixa:document.getElementById('c-orixa').value,status:document.getElementById('c-status').value,local:document.getElementById('c-local').value,quantidade:document.getElementById('c-qtd').value,foto:document.getElementById('c-foto').value,observacoes:document.getElementById('c-obs').value})});
    const j=await r.json();
    if(j.ok){toast('✓ Item gravado!');limparAcervo();acervo=[];carregarAcervo();}
    else toast(j.erro||'Erro.',false);
  }catch(e){toast('Erro de conexão.',false);}finally{btn.disabled=false;btn.textContent='Gravar';}
}
function limparAcervo(){['c-nome','c-local','c-foto','c-obs'].forEach(id=>document.getElementById(id).value='');document.getElementById('c-qtd').value=1;['c-cat','c-orixa','c-status'].forEach(id=>document.getElementById(id).selectedIndex=0);document.getElementById('c-subcat').innerHTML='<option value="">—</option>';}

async function salvarConsumivel(){
  const nome=document.getElementById('cu-nome').value.trim();
  if(!nome){toast('Informe o nome do item.',false);return;}
  const btn=document.getElementById('btnCsm');btn.disabled=true;btn.textContent='Atualizando...';
  try{
    const r=await fetch(URL_GS,{method:'POST',body:JSON.stringify({acao:'consumivel-atualizar',nome,atual:document.getElementById('cu-atual').value,minimo:document.getElementById('cu-min').value,fornecedor:document.getElementById('cu-forn').value,precoPacote:document.getElementById('cu-preco').value,qtdPacote:document.getElementById('cu-qtdpac').value,link:document.getElementById('cu-link').value})});
    const j=await r.json();
    if(j.ok){toast('✓ Atualizado! Nível: '+j.nivel);limparConsumivel();consumiveis=[];carregarConsumiveis();}
    else toast(j.erro||'Erro.',false);
  }catch(e){toast('Erro de conexão.',false);}finally{btn.disabled=false;btn.textContent='Atualizar';}
}
function limparConsumivel(){['cu-nome','cu-atual','cu-min','cu-forn','cu-preco','cu-qtdpac','cu-link'].forEach(id=>document.getElementById(id).value='');}

async function salvarFilho(){
  const btn=document.getElementById('btnFilho');btn.disabled=true;btn.textContent='Gravando...';
  try{
    const r=await fetch(URL_GS,{method:'POST',body:JSON.stringify({acao:'filho-inserir',nomeSanto:document.getElementById('f-nome').value,nomeSocial:document.getElementById('f-social').value,contato:document.getElementById('f-contato').value,orixa:document.getElementById('f-orixa').value,adjunto:document.getElementById('f-adjunto').value,nacao:document.getElementById('f-nacao').value,statusTerreiro:document.getElementById('f-status').value,aniversario:document.getElementById('f-aniv').value,feitura:document.getElementById('f-feitura').value,proximaObrigacao:document.getElementById('f-obrig').value,obrigacoesRealizadas:document.getElementById('f-obrigrealiz').value,observacoes:document.getElementById('f-obs').value})});
    const j=await r.json();
    if(j.ok){toast('✓ Gravado!');limparFilho();filhos=[];carregarFilhos();}
    else toast(j.erro||'Erro.',false);
  }catch(e){toast('Erro de conexão.',false);}finally{btn.disabled=false;btn.textContent='Gravar';}
}
function limparFilho(){['f-nome','f-social','f-contato','f-aniv','f-feitura','f-obrig','f-obrigrealiz','f-obs'].forEach(id=>document.getElementById(id).value='');document.getElementById('f-status').value='Ativo';['f-orixa','f-adjunto','f-nacao'].forEach(id=>document.getElementById(id).selectedIndex=0);}

// ── ML ────────────────────────────────────────────────
async function buscarML(){
  const q=document.getElementById('ml-q').value.trim();if(!q){toast('Digite o que deseja buscar.',false);return;}
  const el=document.getElementById('ml-resultado');el.innerHTML='<div class="empty">Buscando...</div>';
  try{
    const r=await fetch(URL_GS+'?acao=ml-buscar&q='+encodeURIComponent(q));const j=await r.json();
    if(!j.ok||!j.resultados?.length){el.innerHTML='<div class="empty">Nenhum resultado.</div>';return;}
    el.innerHTML=j.resultados.map(x=>`
      <div class="ml-item">
        <img class="ml-thumb" src="${x.thumbnail}" onerror="this.style.display='none'"/>
        <div class="ml-info"><div class="ml-nome">${x.titulo}</div><div class="ml-preco">R$\u00a0${Number(x.preco).toLocaleString('pt-BR',{minimumFractionDigits:2})}</div></div>
        <button class="btn-ml-usar" onclick="usarML('${encodeURIComponent(x.titulo)}',${x.preco},'${encodeURIComponent(x.link||'')}')">Usar</button>
      </div>`).join('');
  }catch(e){el.innerHTML='<div class="empty">Erro na busca.</div>';}
}
function usarML(titulo,preco,link){
  document.getElementById('cu-nome').value=decodeURIComponent(titulo);
  document.getElementById('cu-preco').value=preco;
  document.getElementById('cu-link').value=decodeURIComponent(link);
  navTo('cadastro',document.querySelectorAll('.nav-btn')[1]);
  toast('✓ Dados preenchidos!');
}
</script>
</body>
</html>
